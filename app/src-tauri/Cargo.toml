[package]
name = "knobset"
description = "Knobset: desktop app for programming Unication G-series pagers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows (cargo#8519).
name = "knobset_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
g5-core = { path = "../../crates/g5-core" }
g5-codeplug = { path = "../../crates/g5-codeplug" }
g5-proto.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
tracing.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Background time and auto-lock control during pager writes. Already in the
# iOS dependency tree via tauri/wry; declared here for direct use.
[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "block2", "UIApplication", "UIResponder"] }
