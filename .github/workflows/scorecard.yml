# OpenSSF Scorecard: grades the repo's supply-chain practices (branch
# protection, pinned actions, token permissions and so on) weekly and on
# pushes to main. Results go only to the Security tab's code scanning
# alerts; publish_results is off, so nothing goes to the public Scorecard
# API and there's no badge.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload results to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
