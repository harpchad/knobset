# OpenSSF Scorecard: grades the repo's supply-chain practices (branch
# protection, pinned actions, token permissions and so on) weekly and on
# pushes to main. Results go to the Security tab's code scanning alerts and
# to the public Scorecard API, which backs the README badge.
#
# publish_results limits what this workflow may contain: GitHub-hosted
# Ubuntu, read-only top-level permissions, and only actions from actions/,
# github/codeql-action and ossf/scorecard-action.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload results to code scanning.
      security-events: write
      # Publish results to the Scorecard API.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
