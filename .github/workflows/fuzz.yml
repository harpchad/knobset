# cargo-fuzz on the parsers that take outside input (fuzz/fuzz_targets):
# pager frames and responses, and RadioReference exports. Ten minutes per
# target weekly and on demand, one minute on PRs that touch them. The corpus
# is cached between runs so coverage builds up. A crash fails the job and
# uploads the input that caused it.
name: Fuzz

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/g5-proto/**"
      - "crates/g5-codeplug/src/rr_import.rs"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "23 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [frame, pager_responses, rr_import]
    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && 60 || 600 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        # New inputs go to corpus/<target>; seeds/<target>, where it exists,
        # holds hand-made starting inputs kept in git.
        run: |
          mkdir -p "corpus/$TARGET"
          dirs=("corpus/$TARGET")
          if [ -d "seeds/$TARGET" ]; then dirs+=("seeds/$TARGET"); fi
          cargo +nightly fuzz run "$TARGET" "${dirs[@]}" -- -max_total_time="$SECONDS_PER_TARGET" -print_final_stats=1

      # Only from main, so PR runs can't seed the shared corpus.
      - name: Save the corpus
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 30
