# Tests and clippy on every PR and every push to main (a required check);
# Linux and Windows installers on v* tags, manual runs, and PRs labelled
# `build-installers` or touching this file. Tag and manual builds get signed
# build provenance attestations (`gh attestation verify <file>
# -R harpchad/knobset`), and their Windows installers are Authenticode-signed
# through Azure Artifact Signing (scripts/windows/sign.ps1). The signed Mac
# DMG and the iPad build stay local (scripts/macos, scripts/ios). Installers
# take 10 to 20 minutes, so they don't build on ordinary PR pushes.
#
# Every action is pinned to a commit SHA, with its version in a comment for
# Dependabot. dtolnay/rust-toolchain has no version tags (its branches name
# toolchains), so its pin is a commit on `stable`, and the `toolchain` input
# still installs the latest stable Rust.
name: Desktop

on:
  # Every PR, docs-only ones included: "Test and clippy" is a required
  # check on main, so it has to report on every PR.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Tests on every push to main, so each merge gets a pass/fail result;
  # installers only on tags.
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  # Release builds use LTO; incremental artifacts only bloat the cache.
  CARGO_INCREMENTAL: 0
  # Microsoft's Artifact Signing client (a signtool plugin), pinned by hash.
  SIGNING_CLIENT_VERSION: 1.0.146
  SIGNING_CLIENT_SHA256: 7761e5d8f31e54b764da21d33cd8b0a2940e1b05526c7dfcb5e94b0431426f70

jobs:
  check:
    name: Test and clippy
    # Adding some other label to a PR shouldn't rerun everything.
    if: github.event.action != 'labeled' || github.event.label.name == 'build-installers'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      installers: ${{ steps.plan.outputs.installers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide whether to build installers
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR: ${{ github.event.pull_request.number }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'build-installers') }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            installers=false
          elif [ "$EVENT" != pull_request ] || [ "$LABELLED" = true ]; then
            installers=true
          elif gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' | grep -qx .github/workflows/desktop.yml; then
            installers=true
          else
            installers=false
          fi
          echo "installers=$installers" | tee -a "$GITHUB_OUTPUT"

      - name: Install Tauri's Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev build-essential file

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Type-check the frontend
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit -p .

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Fixture tests need private pager backups and Unication templates;
      # without them they skip.
      - name: Test
        run: cargo test --workspace

  installers:
    name: Installer (${{ matrix.name }})
    needs: check
    if: needs.check.outputs.installers == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 sets the glibc floor (2.35) for the AppImage and .deb.
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact: linux
            files: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
          # Same glibc floor; runs on ARM machines such as a Raspberry Pi 4
          # or 5 and Linux VMs on Apple silicon.
          - name: Linux ARM
            os: ubuntu-22.04-arm
            bundles: appimage,deb
            artifact: linux-arm64
            files: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact: windows-x64
            files: target/release/bundle/nsis/*-setup.exe
          # Native ARM64 build. Unication's RNDIS driver is x64 only, so on
          # ARM Windows the pager needs Windows' own RNDIS driver, bound by
          # scripts/windows/install-rndis.ps1 (attached to each release).
          - name: Windows ARM
            os: windows-11-arm
            bundles: nsis
            artifact: windows-arm64
            files: target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    # Windows builds on tags and manual runs sign, so they run in the
    # `release` environment: it holds the Azure IDs (not secrets), only
    # accepts v* tags and main, waits for approval, and is the only subject
    # Azure's federated credential trusts.
    environment: ${{ startsWith(matrix.os, 'windows') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'release' || '' }}
    env:
      SIGN: ${{ startsWith(matrix.os, 'windows') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 45
    permissions:
      contents: read
      # Build provenance attestations on tag and manual builds.
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri's Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev build-essential file patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: installer

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # The only Windows run of the core crates: MSVC's build of the vendored
      # SQLite 2 and Windows file semantics. The Linux check job covers the rest.
      - name: Test the core crates on Windows
        if: runner.os == 'Windows'
        run: cargo test -p sqlite2 -p g5-proto -p g5-codeplug -p g5-core -p g5-cli

      # The signing client is x64-only .NET 8, so ARM runners get the x64
      # runtime and run it emulated.
      - name: Set up .NET for the signing client
        if: env.SIGN == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          architecture: x64

      - name: Sign in to Azure (GitHub OIDC, no secret)
        if: env.SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # Its only role is on the certificate profile, not the
          # subscription, and signing needs nothing more.
          allow-no-subscriptions: true

      # Fetches the client, writes its metadata.json, and a Tauri config
      # overlay that makes sign.ps1 the signCommand for this build only.
      - name: Prepare the signing client
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP artifact-signing
          New-Item -ItemType Directory -Force $dir | Out-Null
          $pkg = Join-Path $dir client.zip
          $v = $env:SIGNING_CLIENT_VERSION
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$v/microsoft.artifactsigning.client.$v.nupkg" -OutFile $pkg
          $hash = (Get-FileHash $pkg -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:SIGNING_CLIENT_SHA256) { throw "signing client hash $hash doesn't match the pin" }
          Expand-Archive $pkg (Join-Path $dir client)
          $dlib = Join-Path $dir client\bin\x64\Azure.CodeSigning.Dlib.dll
          $metadata = Join-Path $dir metadata.json
          # Only the Azure CLI login above may sign; no other credential source.
          @{
            Endpoint = $env:ENDPOINT
            CodeSigningAccountName = $env:ACCOUNT
            CertificateProfileName = $env:PROFILE
            ExcludeCredentials = @('ManagedIdentityCredential', 'EnvironmentCredential', 'WorkloadIdentityCredential', 'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
          } | ConvertTo-Json | Set-Content $metadata
          $overlay = Join-Path $dir tauri.sign.json
          @{ bundle = @{ windows = @{ signCommand = @{
            cmd = 'powershell'
            args = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', (Join-Path $env:GITHUB_WORKSPACE scripts\windows\sign.ps1), '%1')
          } } } } | ConvertTo-Json -Depth 6 | Set-Content $overlay
          "KNOBSET_SIGN_DLIB=$dlib" >> $env:GITHUB_ENV
          "KNOBSET_SIGN_METADATA=$metadata" >> $env:GITHUB_ENV
          "TAURI_SIGN_CONFIG=$overlay" >> $env:GITHUB_ENV

      - name: Build the installer
        working-directory: app
        run: npx tauri build --bundles ${{ matrix.bundles }} ${TAURI_SIGN_CONFIG:+--config "$TAURI_SIGN_CONFIG"}

      # Fails the build if the app or the installer isn't validly signed and
      # timestamped (Artifact Signing certificates last three days, so the
      # timestamp is what keeps a signature valid).
      - name: Check the signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $files = @((Resolve-Path target/release/knobset.exe).Path) + (Get-ChildItem target/release/bundle/nsis/*-setup.exe).FullName
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            "{0}: {1}, {2}, timestamped by {3}" -f (Split-Path $f -Leaf), $sig.Status, $sig.SignerCertificate.Subject, $sig.TimeStamperCertificate.Subject
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) { throw "$f isn't validly signed and timestamped" }
          }

      # Signs "this file came from this workflow at this commit" through
      # Sigstore; anyone can check it with `gh attestation verify`.
      - name: Attest build provenance
        id: attest
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.files }}

      # The same attestation as a file next to each installer, so it ships
      # with the release (and verifies offline with `--bundle`). On Linux one
      # bundle covers both the AppImage and the .deb.
      - name: Save the Sigstore bundle next to each file
        if: steps.attest.outcome == 'success'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          FILES: ${{ matrix.files }}
        run: |
          for f in $FILES; do
            cp "$BUNDLE" "$f.sigstore.json"
          done
          ls -l target/release/bundle/*/*.sigstore.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knobset-${{ matrix.artifact }}
          path: |
            ${{ matrix.files }}
            target/release/bundle/*/*.sigstore.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to the GitHub Release
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # The release (with its notes) is created by hand, as the Mac script
      # requires. If it isn't there yet, create it and rerun this job.
      - name: Upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match tauri.conf.json version $version"
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null; then
            echo "::error::no GitHub Release $TAG yet: create it, then rerun this job (the installers are also in this run's artifacts)"
            exit 1
          fi
          # The Linux artifact keeps its appimage/ and deb/ folders.
          mapfile -t files < <(find dist -type f)
          files+=(scripts/windows/install-rndis.ps1)
          ls -l "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
          # The Mac script reruns this after attaching the DMG.
          scripts/release-checksums.sh "$TAG"
