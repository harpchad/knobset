# Tests and clippy on every PR that touches code; unsigned Linux and Windows
# installers on v* tags, manual runs, and PRs labelled `build-installers` or
# touching this file. Tag and manual builds get signed build provenance
# attestations (`gh attestation verify <file> -R harpchad/knobset`). The
# signed Mac DMG and the iPad build stay local (scripts/macos, scripts/ios).
# Installers take 10 to 20 minutes, so they don't build on ordinary PR
# pushes.
#
# Every action is pinned to a commit SHA, with its version in a comment for
# Dependabot. dtolnay/rust-toolchain has no version tags (its branches name
# toolchains), so its pin is a commit on `stable`, and the `toolchain` input
# still installs the latest stable Rust.
name: Desktop

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "crates/**"
      - "app/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  # Release builds use LTO; incremental artifacts only bloat the cache.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Test and clippy
    # Adding some other label to a PR shouldn't rerun everything.
    if: github.event.action != 'labeled' || github.event.label.name == 'build-installers'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      installers: ${{ steps.plan.outputs.installers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide whether to build installers
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'build-installers') }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$LABELLED" = true ]; then
            installers=true
          elif gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' | grep -qx .github/workflows/desktop.yml; then
            installers=true
          else
            installers=false
          fi
          echo "installers=$installers" | tee -a "$GITHUB_OUTPUT"

      - name: Install Tauri's Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev build-essential file

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Type-check the frontend
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit -p .

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Fixture tests need private pager backups and Unication templates;
      # without them they skip.
      - name: Test
        run: cargo test --workspace

  installers:
    name: Installer (${{ matrix.name }})
    needs: check
    if: needs.check.outputs.installers == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 sets the glibc floor (2.35) for the AppImage and .deb.
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact: linux
            files: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact: windows-x64
            files: target/release/bundle/nsis/*-setup.exe
          # Native ARM64 build. Unication's RNDIS driver is x64 only, so on
          # ARM Windows the pager needs Windows' own RNDIS driver, bound by
          # scripts/windows/install-rndis.ps1 (attached to each release).
          - name: Windows ARM
            os: windows-11-arm
            bundles: nsis
            artifact: windows-arm64
            files: target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      # Build provenance attestations on tag and manual builds.
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri's Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev build-essential file patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: installer

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # The only Windows run of the core crates: MSVC's build of the vendored
      # SQLite 2 and Windows file semantics. The Linux check job covers the rest.
      - name: Test the core crates on Windows
        if: runner.os == 'Windows'
        run: cargo test -p sqlite2 -p g5-proto -p g5-codeplug -p g5-core -p g5-cli

      - name: Build the installer
        working-directory: app
        run: npx tauri build --bundles ${{ matrix.bundles }}

      # Signs "this file came from this workflow at this commit" through
      # Sigstore; anyone can check it with `gh attestation verify`.
      - name: Attest build provenance
        id: attest
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.files }}

      # The same attestation as a file next to each installer, so it ships
      # with the release (and verifies offline with `--bundle`). On Linux one
      # bundle covers both the AppImage and the .deb.
      - name: Save the Sigstore bundle next to each file
        if: steps.attest.outcome == 'success'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          FILES: ${{ matrix.files }}
        run: |
          for f in $FILES; do
            cp "$BUNDLE" "$f.sigstore.json"
          done
          ls -l target/release/bundle/*/*.sigstore.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knobset-${{ matrix.artifact }}
          path: |
            ${{ matrix.files }}
            target/release/bundle/*/*.sigstore.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to the GitHub Release
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # The release (with its notes) is created by hand, as the Mac script
      # requires. If it isn't there yet, create it and rerun this job.
      - name: Upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match tauri.conf.json version $version"
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null; then
            echo "::error::no GitHub Release $TAG yet: create it, then rerun this job (the installers are also in this run's artifacts)"
            exit 1
          fi
          # The Linux artifact keeps its appimage/ and deb/ folders.
          mapfile -t files < <(find dist -type f)
          files+=(scripts/windows/install-rndis.ps1)
          ls -l "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
          # The Mac script reruns this after attaching the DMG.
          scripts/release-checksums.sh "$TAG"
